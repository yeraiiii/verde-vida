    <circle cx="420" cy="380" r="5" fill="#9b6b43"/>
  </g>

  <!-- Manchas orgánicas -->
  <circle cx="160" cy="200" r="34" fill="#a58b5f" opacity="0.25"/>
  <circle cx="150" cy="215" r="22" fill="#a58b5f" opacity="0.2"/>
  <circle cx="740" cy="420" r="40" fill="#5c7d6a" opacity="0.2"/>

  <text x="450" y="555" font-family="Georgia, serif" font-size="22" fill="#5c7d6a" text-anchor="middle" letter-spacing="3" opacity="0.9">alimentación · nutrición</text>
