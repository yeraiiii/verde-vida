  </defs>
  <rect width="900" height="600" fill="url(#bg)"/>
  <circle cx="760" cy="90" r="160" fill="#ffffff" opacity="0.2"/>
  <circle cx="90" cy="540" r="200" fill="#ffffff" opacity="0.15"/>

  <!-- Frasco -->
