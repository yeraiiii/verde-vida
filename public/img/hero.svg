  <text x="450" y="148" font-family="Georgia, serif" font-size="26" fill="#eaf1eb" text-anchor="middle" letter-spacing="4">VIDA</text>

  <!-- Hojas dentro -->
  <g>
    <path d="M430 210 q40 -50 80 -20 q-10 60 -50 70 q-30 10 -30 -20z" fill="url(#leaf)"/>
    <path d="M470 250 q40 -30 60 0 q-10 50 -40 55 q-30 8 -20 -25z" fill="#5c7d6a"/>
